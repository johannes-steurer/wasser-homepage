<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wassergenossenschaften Sulzberg</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="landing-container">
    <header class="landing-header">
      <h1>Wassergenossenschaften Sulzberg</h1>
      <p>Gemeinde Sulzberg, Vorarlberg &mdash; Ihre Wasserversorgung vor Ort</p>
    </header>

    <div class="coop-grid">
      <a href="kirchdorf/" class="coop-card">
        <img src="assets/LogoKirchdorf.png" alt="Logo Kirchdorf" class="coop-logo">
        <h2>Kirchdorf</h2>
        <p class="coop-status active">Aktiv</p>
      </a>
      <div class="coop-card disabled">
        <img src="assets/LogoKirchdorf.png" alt="Logo Sonnenseite" class="coop-logo">
        <h2>Sonnenseite</h2>
        <p class="coop-status inactive">Demnächst</p>
      </div>
      <div class="coop-card disabled">
        <img src="assets/LogoHinterberg.png" alt="Logo Hinterberg" class="coop-logo">
        <h2>Hinterberg</h2>
        <p class="coop-status inactive">Demnächst</p>
      </div>
      <div class="coop-card disabled">
        <img src="assets/LogoKirchdorf.png" alt="Logo Thal" class="coop-logo">
        <h2>Thal</h2>
        <p class="coop-status inactive">Demnächst</p>
      </div>
    </div>
  </div>
</body>
</html>
